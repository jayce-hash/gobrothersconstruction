<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121a36">
<title>Website Dashboard | GO Brothers Construction</title>
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/favicon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css?v=3">
</head>
<body>
  <!-- Sign in -->
  <main id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="/img/mark.webp" alt="GO Brothers Construction" class="login-logo">
      <h1>Website Dashboard</h1>
      <p class="muted">Update your projects, services, reviews and info. Changes go live as soon as you save.</p>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary wide" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="app" hidden>
    <header class="top">
      <p class="wordmark small">GO Brothers</p>
      <div class="top-actions">
        <a class="btn ghost sm" href="/" target="_blank" rel="noopener">View site ↗</a>
        <button class="btn ghost sm" id="logout" type="button">Sign out</button>
      </div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="photos">📸 Photos</button>
      <button role="tab" data-tab="menu">🔨 Services</button>
      <button role="tab" data-tab="reviews">💬 Reviews</button>
      <button role="tab" data-tab="about">🏠 About</button>
      <button role="tab" data-tab="info">📞 Contact &amp; Info</button>
      <button role="tab" data-tab="policies">📄 Good to know</button>
      <button role="tab" data-tab="help">❓ Help</button>
    </nav>
    <main id="panel" class="panel" tabindex="-1"></main>

    <div class="savebar" id="savebar" hidden>
      <span>You have unsaved changes</span>
      <div>
        <button class="btn ghost sm" id="discard" type="button">Undo</button>
        <button class="btn primary" id="save" type="button">Save &amp; publish</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/sortable.min.js"></script>
  <script src="/admin/admin.js?v=3"></script>
</body>
</html>
